# Publie la visionneuse sur GitHub Pages avec Shinylive, à chaque push sur main.
# Fichier écrit par scripts/deploy_viewer.R (projet CHARISMAM).
name: Deploy viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install shinylive
        run: Rscript -e 'install.packages("shinylive")'
      - name: Export app
        run: |
          mkdir -p _app && cp app.R *.csv _app/ && cp comments_url.txt _app/ 2>/dev/null || true
          Rscript -e 'shinylive::export("_app", "_site")'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
